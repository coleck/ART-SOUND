
services:
  db:
    image: postgres:16-alpine
    container_name: picture_sound_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: picture_sound
      POSTGRES_USER: picture_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U picture_user -d picture_sound"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: picture_sound_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://picture_user:${POSTGRES_PASSWORD}@db:5432/picture_sound
      FRONTEND_URL: http://localhost:8080
    volumes:
      - ./media:/app/media
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: picture_sound_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
